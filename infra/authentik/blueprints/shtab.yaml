# Настройка Authentik под Shtab. Применяется автоматически при старте
# (и при изменении файла). Секреты — из переменных окружения (.env).
#
# Что создаёт:
#   - поток регистрации только по приглашению (shtab-invitation-enrollment);
#   - OIDC-провайдер и приложение «Shtab» — через них ядро делает вход.
# Публичной регистрации нет: стандартный поток входа не содержит ссылки «Зарегистрироваться».
version: 1
metadata:
  name: Shtab
entries:
  # --- Зависимости: стандартные blueprints Authentik, на объекты которых ссылаемся.
  # Без них на чистой установке наш blueprint может примениться раньше и упасть.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: default/flow-default-provider-authorization-implicit-consent.yaml
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: default/flow-default-provider-invalidation.yaml
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: system/providers-oauth2.yaml
      required: true

  # --- Регистрация по приглашению --------------------------------------------
  - model: authentik_flows.flow
    id: enrollment-flow
    identifiers:
      slug: shtab-invitation-enrollment
    attrs:
      name: Shtab — регистрация по приглашению
      title: Добро пожаловать в Shtab
      designation: enrollment
      authentication: require_unauthenticated

  - model: authentik_stages_invitation.invitationstage
    id: invitation-stage
    identifiers:
      name: shtab-invitation
    attrs:
      continue_flow_without_invitation: false  # без приглашения дальше не пустит

  - model: authentik_stages_prompt.prompt
    id: field-username
    identifiers:
      name: shtab-field-username
    attrs:
      field_key: username
      label: Логин
      type: username
      required: true
      placeholder: Логин
      placeholder_expression: false
      order: 0

  - model: authentik_stages_prompt.prompt
    id: field-password
    identifiers:
      name: shtab-field-password
    attrs:
      field_key: password
      label: Пароль
      type: password
      required: true
      placeholder: Пароль
      placeholder_expression: false
      order: 1

  - model: authentik_stages_prompt.prompt
    id: field-password-repeat
    identifiers:
      name: shtab-field-password-repeat
    attrs:
      field_key: password_repeat
      label: Пароль ещё раз
      type: password
      required: true
      placeholder: Пароль ещё раз
      placeholder_expression: false
      order: 2

  - model: authentik_stages_prompt.prompt
    id: field-name
    identifiers:
      name: shtab-field-name
    attrs:
      field_key: name
      label: Имя
      type: text
      required: true
      placeholder: Имя и фамилия
      placeholder_expression: false
      order: 0

  - model: authentik_stages_prompt.prompt
    id: field-email
    identifiers:
      name: shtab-field-email
    attrs:
      field_key: email
      label: Email
      type: email
      required: true
      placeholder: Email
      placeholder_expression: false
      order: 1

  - model: authentik_stages_prompt.promptstage
    id: prompt-credentials
    identifiers:
      name: shtab-enrollment-credentials
    attrs:
      fields:
        - !KeyOf field-username
        - !KeyOf field-password
        - !KeyOf field-password-repeat

  - model: authentik_stages_prompt.promptstage
    id: prompt-details
    identifiers:
      name: shtab-enrollment-details
    attrs:
      fields:
        - !KeyOf field-name
        - !KeyOf field-email

  - model: authentik_stages_user_write.userwritestage
    id: user-write
    identifiers:
      name: shtab-enrollment-user-write
    attrs:
      user_creation_mode: always_create
      user_type: internal
      user_path_template: users/shtab

  - model: authentik_stages_user_login.userloginstage
    id: user-login
    identifiers:
      name: shtab-enrollment-user-login

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf enrollment-flow
      stage: !KeyOf invitation-stage
      order: 5
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf enrollment-flow
      stage: !KeyOf prompt-credentials
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf enrollment-flow
      stage: !KeyOf prompt-details
      order: 15
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf enrollment-flow
      stage: !KeyOf user-write
      order: 20
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf enrollment-flow
      stage: !KeyOf user-login
      order: 100

  # --- OIDC: вход в Shtab ------------------------------------------------------
  - model: authentik_providers_oauth2.oauth2provider
    id: shtab-provider
    identifiers:
      name: Shtab
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # Только вход через код авторизации (+ обновление токена). Implicit/password — нет.
      grant_types:
        - authorization_code
        - refresh_token
      client_id: !Env SHTAB_OIDC_CLIENT_ID
      client_secret: !Env SHTAB_OIDC_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/api/auth/callback", !Env SHTAB_PUBLIC_URL]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_uuid
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]

  - model: authentik_core.application
    identifiers:
      slug: shtab
    attrs:
      name: Shtab
      provider: !KeyOf shtab-provider
      meta_launch_url: !Env SHTAB_PUBLIC_URL
      policy_engine_mode: any
