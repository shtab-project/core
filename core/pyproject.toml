[project]
name = "shtab-core"
version = "0.1.0"
description = "Ядро Shtab: задачи, канбан, каталог плагинов, MCP-шлюз"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.140",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.13",
    "pydantic-settings>=2.10",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.30",
    "alembic>=1.20",
    "redis>=8.0",
    "taskiq>=0.13",
    "taskiq-redis>=1.2",
    "mcp>=2.3,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "aiosqlite>=0.21",
    "httpx>=0.28",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shtab"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
