# Shtab — фундамент для локальной разработки.
# Адреса (*.localhost браузер сам резолвит в 127.0.0.1):
#   http://api.shtab.localhost/docs        — API ядра (Swagger)
#   http://api.shtab.localhost/mcp         — MCP-шлюз
#   http://notes.shtab.localhost           — общие заметки (SilverBullet)
#   http://admin.notes.shtab.localhost     — личные заметки пользователя admin
#   http://localhost:8080                  — панель Traefik
#
# Этап 2: Authentik + forward-auth на всех роутерах (см. README → «Дорожная карта»).

x-core: &core
  build: ./core
  restart: unless-stopped
  env_file: .env
  environment:
    SHTAB_DATABASE_URL: postgresql+asyncpg://shtab:${POSTGRES_PASSWORD}@postgres:5432/shtab
    SHTAB_REDIS_URL: redis://redis:6379/0
    SHTAB_NOTES_ROOT: /notes
  volumes:
    - ./data/notes:/notes
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  traefik:
    image: traefik:v3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.insecure=true
    ports:
      - "80:80"
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shtab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: shtab
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shtab"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  core:
    <<: *core
    labels:
      - traefik.enable=true
      - traefik.http.routers.core.rule=Host(`api.shtab.localhost`)
      - traefik.http.services.core.loadbalancer.server.port=8000

  worker:
    <<: *core
    command: taskiq worker shtab.worker:broker

  watcher:
    <<: *core
    command: python -m shtab.watcher
    environment:
      SHTAB_DATABASE_URL: postgresql+asyncpg://shtab:${POSTGRES_PASSWORD}@postgres:5432/shtab
      SHTAB_REDIS_URL: redis://redis:6379/0
      SHTAB_NOTES_ROOT: /notes
      WATCHFILES_FORCE_POLLING: "true"  # иначе на Docker Desktop изменения файлов не видны

  # --- Заметки: один экземпляр SilverBullet на пространство ---
  notes-shared:
    image: ghcr.io/silverbulletmd/silverbullet:latest
    restart: unless-stopped
    volumes:
      - ./data/notes/shared:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.notes-shared.rule=Host(`notes.shtab.localhost`)
      - traefik.http.services.notes-shared.loadbalancer.server.port=3000

  notes-admin:
    image: ghcr.io/silverbulletmd/silverbullet:latest
    restart: unless-stopped
    volumes:
      - ./data/notes/users/admin:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.notes-admin.rule=Host(`admin.notes.shtab.localhost`)
      - traefik.http.services.notes-admin.loadbalancer.server.port=3000

volumes:
  postgres:
