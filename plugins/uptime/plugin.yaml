# Черновик формата манифеста плагина
id: uptime
name: Мониторинг
description: Следит, живы ли рабочие сайты и серверы (Uptime Kuma)
version: 0.1.0
icon: activity

compose: docker-compose.yml

# Публикация: поддомен -> сервис:порт из docker-compose.yml
routes:
  - subdomain: uptime          # → uptime.shtab.<домен>
    service: kuma
    port: 3001

# forward — Authentik проверяет вход до того, как запрос дойдёт до сервиса.
# oidc    — сервис сам умеет OIDC, ядро выдаст ему клиента в Authentik.
# none    — публично (только осознанно).
auth: forward
access:
  groups: [shtab-admins]

resources:
  memory: 256m

# Необязательно: MCP-сервер плагина, инструменты которого подключаются к шлюзу Shtab.
# mcp:
#   url: http://kuma-mcp:8000/mcp
