[project]
name = "shtab-core"
version = "0.1.0"
description = "Ядро Shtab: организация, пользователи, вход через Authentik"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.140",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.10",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.30",
    "alembic>=1.20",
    "redis>=8.0",
    "authlib>=1.6",
    "itsdangerous>=2.2",
    "httpx2>=2.13.1",
    "uuid6>=2025.0.1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shtab_core"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
